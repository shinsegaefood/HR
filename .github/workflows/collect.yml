name: 매일 자동수집

on:
  schedule:
    - cron: "17 21 * * *"    # 한국시간 06:17 (정각 피함)
    - cron: "55 21 * * *"    # 한국시간 06:17 (정각 피함)
    - cron: "47 23 * * *"    # 한국시간 08:47 (첫 번째가 밀리거나 빠졌을 때 대비)
  workflow_dispatch:           # Actions 탭에서 "Run workflow"로 지금 바로 실행

permissions:
  contents: write              # 수집 결과(data 폴더)를 저장소에 저장하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 수집 실행
        env:
          ASSEMBLY_KEY: ${{ secrets.ASSEMBLY_KEY }}
          LAW_OC:       ${{ secrets.LAW_OC }}
          NAVER_ID:     ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: python scripts/collect.py

      - name: 결과 저장
        run: |
          git config user.name  "issue-board-bot"
          git config user.email "issue-board-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동수집 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git push
          fi
